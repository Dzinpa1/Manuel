<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="HTML|CSS|JS">
    <meta property="og:title" content="Manuellinc...">
    <title>Frontend Mentor | Interactive rating component</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Halant:wght@300;400;500;600;700&family=Overpass:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="normalize.css">
</head>
<body>
    <div class="rating-page container" >
        <div class="box">
            <div class="box-content">
                <div class="icon">
                    <img src="images/icon-star.svg" alt="star-icon">
                </div>
                <div>
                    <h1>
                        How did we do?
                    </h1>
                    <p class="content-paragragh">
                        Please let us know how we did with your support request. All feedback is appreciated 
                        to help us improve our offering!
                    </p>
                </div>
                <div class="numbers">
                    <button class="round-btn">1</button>
                    <button class="round-btn">2</button>
                    <button class="round-btn">3</button>
                    <button class="round-btn">4</button>
                    <button class="round-btn">5</button>
                </div>
                <button type="submit" class="submit-btn">submit</button>
            </div>
        </div>
    </div>
    <!--thank you state -->
    <div class="thank-you-page pop-up-container" >
        <div class="pop-up">
            <div class="pop-up-content">
                <button class="close-btn"><img src="https://www.svgrepo.com/show/415928/close-mobile-ui.svg" alt="Close Mobile Ui SVG Vector Icon"/></button> 
                <div class="thank-you-image">
                    <img src="images/illustration-thank-you.svg" alt="thank-you-image">
                </div>
                <div class="rate-info">
                    <p>You selected <span class="rate"></span> out of 5</p>
                </div>
                <div class="thank-you-message">
                    <h1>Thank you!</h1>
                    <p class="content-paragragh">
                    We appreciate you taking the time to give a rating. If you ever need more support, 
                    don't hesitate to get in touch!
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js" ></script>
</body>
