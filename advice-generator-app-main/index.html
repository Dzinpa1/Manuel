<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="HTML|CSS|JS">
    <meta property="og:title" content="Manuellinc...">
    <title>Frontend Mentor |Advice generator app</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Gowun+Batang:wght@400;700&family=Halant:wght@300;400;500;600;700&family=Manrope:wght@200..800&family=Overpass:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="normalize.css">
</head>
<body>
    <main class="container">
        <div class="advice-box">
            <h1 class="advice-heading">ADVICE #<span class="adviceID"></span></h1>
            <blockquote class="advice"></blockquote>
            <div>
                <img class="desktop-pattern" src="images/pattern-divider-desktop.svg" alt="pattern divider">
                <img class="mobile-pattern" src="images/pattern-divider-mobile.svg" alt="pattern divider">
            </div>
            <button class="generate-btn" aria-label="Generate new advice">
                <img src="images/icon-dice.svg" alt="dice icon">
            </button>
        </div>
    </main>
    <script src="script.js" ></script>
</body>
